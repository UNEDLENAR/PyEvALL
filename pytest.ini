[pytest]
testpaths = test
python_files = test_*.py
addopts = -q -rA
markers =
    format: format parsing and validation tests
    json_format: JSON file format validation tests
    wrappers: TSV/CSV wrapper conversion tests
    consistency: value type consistency tests
    clustering: clustering/multilabel list-format validation tests
    classification: classification metric comparison tests
    ranking: ranking metric comparison tests
